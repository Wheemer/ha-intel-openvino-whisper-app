name: Quality and security

on:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "15 7 * * 0"

permissions:
  contents: read
  security-events: write

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Lint workflows
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 -color

      - name: Lint shell scripts
        run: shellcheck -x --severity=warning -e SC1090 intel_openvino_whisper/run.sh scripts/*.sh

      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@v3.5.0
        with:
          dockerfile: intel_openvino_whisper/Dockerfile
          failure-threshold: error

  build-and-scan:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Build image
        run: |
          docker build \
            --build-arg BUILD_VERSION=ci \
            --build-arg BUILD_ARCH=amd64 \
            --tag app-under-test:ci \
            intel_openvino_whisper

      - name: Scan image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: app-under-test:ci
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: 1

      - name: Upload scan results
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results.sarif
