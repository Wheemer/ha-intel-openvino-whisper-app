name: Check upstream releases

on:
  workflow_dispatch:
  schedule:
    - cron: "30 8 * * 1"

permissions:
  attestations: write
  contents: write
  id-token: write
  packages: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Check pinned upstream sources
        id: update
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/update-upstream.py

      - name: Build proposed image
        if: steps.update.outputs.changed == 'true'
        run: |
          docker build \
            --build-arg BUILD_ARCH=amd64 \
            --build-arg BUILD_VERSION="${{ steps.update.outputs.version }}" \
            --tag "ghcr.io/wheemer/amd64-app-intel-openvino-whisper:${{ steps.update.outputs.version }}" \
            intel_openvino_whisper

      - name: Log in to GitHub Container Registry
        if: steps.update.outputs.changed == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish tested image
        id: publish
        if: steps.update.outputs.changed == 'true'
        shell: bash
        run: |
          image="ghcr.io/wheemer/amd64-app-intel-openvino-whisper:${{ steps.update.outputs.version }}"
          docker push "$image"
          digest="$(docker image inspect "$image" --format '{{ index .RepoDigests 0 }}' | cut -d@ -f2)"
          test -n "$digest"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Attest image provenance
        if: steps.update.outputs.changed == 'true'
        uses: actions/attest-build-provenance@v4.2.2
        with:
          subject-name: ghcr.io/wheemer/amd64-app-intel-openvino-whisper
          subject-digest: ${{ steps.publish.outputs.digest }}
          push-to-registry: true

      - name: Open and merge upstream pull request
        if: steps.update.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          branch="automation/upstream-updates"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$branch"
          git add intel_openvino_whisper/config.yaml intel_openvino_whisper/Dockerfile intel_openvino_whisper/CHANGELOG.md
          git commit -m "Update pinned upstream dependencies"
          git push --force origin "$branch"
          pr_url="$(gh pr list --base main --head "$branch" --state open --json url --jq '.[0].url')"
          if [ -z "$pr_url" ]; then
            pr_url="$(gh pr create \
              --base main \
              --head "$branch" \
              --title "Update pinned upstream dependencies" \
              --body "Automated upstream update. The proposed image completed a clean cloud build and was published to GHCR. This pull request is merged automatically; Home Assistant installs the new app version through auto-update.")"
          else
            gh pr edit "$pr_url" \
              --title "Update pinned upstream dependencies" \
              --body "Automated upstream update. The proposed image completed a clean cloud build and was published to GHCR. This pull request is merged automatically; Home Assistant installs the new app version through auto-update."
          fi
          gh pr merge "$pr_url" --squash --delete-branch

      - name: Publish GitHub release
        if: steps.update.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v${{ steps.update.outputs.version }}" \
            --target main \
            --title "v${{ steps.update.outputs.version }}" \
            --generate-notes
