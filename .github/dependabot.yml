version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: America/St_Johns
    open-pull-requests-limit: 10
    labels:
      - dependencies

  - package-ecosystem: docker
    directory: /intel_openvino_whisper
    schedule:
      interval: weekly
      day: monday
      time: "05:15"
      timezone: America/St_Johns
    open-pull-requests-limit: 5
    labels:
      - dependencies
    ignore:
      # Base OS updates must stay coordinated with the matching OpenVINO archive
      # and the separately versioned Intel Gen9 legacy1 compute runtime.
      - dependency-name: ubuntu
