version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: America/St_Johns
    open-pull-requests-limit: 10
    labels:
      - dependencies

  - package-ecosystem: docker
    directory: /intel_openvino_whisper
    schedule:
      interval: weekly
      day: monday
      time: "05:15"
      timezone: America/St_Johns
    open-pull-requests-limit: 5
    labels:
      - dependencies
    ignore:
      # The tested OpenVINO 2023 archive and legacy Gen9 driver stack are
      # Jammy-specific. Evaluate a modern legacy1 stack as a separate change.
      - dependency-name: ubuntu
